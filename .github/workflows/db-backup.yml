name: Weekly Encrypted Database Backup

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    name: Backup and Encrypt Database
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL Client and GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client gpg

      - name: Dump and Encrypt Database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PUBKEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. Skipping backup."
            exit 1
          fi

          if [ -z "$BACKUP_PUBKEY" ]; then
            echo "::error::BACKUP_PUBLIC_KEY secret is not set. Refusing to create or upload unencrypted dump."
            exit 1
          fi

          BACKUP_DATE=$(date +'%Y%m%d_%H%M%S')
          DUMP_FILE="deprem_backup_${BACKUP_DATE}.sql.gz"
          ENC_FILE="${DUMP_FILE}.gpg"

          echo "Exporting database..."
          pg_dump "$DB_URL" --clean --if-exists --no-owner --no-privileges | gzip > "$DUMP_FILE"

          echo "Importing backup public key..."
          echo "$BACKUP_PUBKEY" | gpg --import

          echo "Encrypting dump file..."
          gpg --encrypt --trust-model always -r backup-recipient "$DUMP_FILE" -o "$ENC_FILE"
          rm -f "$DUMP_FILE"

          if [ ! -f "$ENC_FILE" ]; then
            echo "::error::Encryption failed. Target file does not exist."
            exit 1
          fi

          echo "BACKUP_FILE=$ENC_FILE" >> $GITHUB_ENV

      - name: Upload Encrypted Artifact
        if: env.BACKUP_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-db-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 28 # Keep up to 4 weeks
