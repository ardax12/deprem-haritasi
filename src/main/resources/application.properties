spring.application.name=deprem

# Server port (uses Heroku $PORT when deployed)
server.port=${PORT:8080}

# Database Configuration:
# Defaults to in-memory H2 with PostgreSQL compatibility for zero-setup local development.
# In production / cloud, set SPRING_DATASOURCE_URL or DATABASE_URL to connect to Supabase / PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:depremdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}}
# Driver class is auto-detected by Spring Boot from the JDBC URL (org.postgresql.Driver for postgresql, org.h2.Driver for h2)
# spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

# H2 Console (disabled by default in production; set SPRING_H2_CONSOLE_ENABLED=true for local debug)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Admin Security Key for protected endpoints (POST /api/v1/archive/*)
app.admin.api-key=${APP_ADMIN_API_KEY:}

# AFAD Poller Configuration (polls last 24 hours every 10 min)
afad.api.url=${AFAD_API_URL:https://deprem.afad.gov.tr/apiv2/event/filter}
afad.sync.enabled=${AFAD_SYNC_ENABLED:true}
afad.sync.interval-ms=${AFAD_SYNC_INTERVAL_MS:600000}
afad.sync.window-hours=${AFAD_SYNC_WINDOW_HOURS:24}

# Retention / Cleanup Configuration (safe export required before deletion)
app.retention.enabled=${APP_RETENTION_ENABLED:true}
app.retention.days=${APP_RETENTION_DAYS:30}
app.retention.dry-run=${APP_RETENTION_DRY_RUN:false}

# Historical Backfill Configuration
afad.backfill.enabled=${AFAD_BACKFILL_ENABLED:false}
afad.backfill.chunk-hours=${AFAD_BACKFILL_CHUNK_HOURS:24}
afad.backfill.delay-ms=${AFAD_BACKFILL_DELAY_MS:500}
afad.backfill.cron=${AFAD_BACKFILL_CRON:0 0 4 * * *}

# Archive Shard & Manifest Export Configuration
app.archive.directory=${APP_ARCHIVE_DIRECTORY:./archive}
app.archive.auto-export-before-cleanup=${APP_ARCHIVE_AUTO_EXPORT:true}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# SEO & Site Base URL Configuration (empty by default to automatically detect current domain/host from HTTP request)
app.site.base-url=${APP_SITE_BASE_URL:}
app.seo.indexnow.enabled=${INDEXNOW_ENABLED:true}
app.seo.indexnow.key=${INDEXNOW_KEY:depremizleme2026indexnowkey}

# KOERI (Kandilli) Poller Configuration
koeri.page.url=${KOERI_PAGE_URL:http://www.koeri.boun.edu.tr/scripts/lst0.asp}
koeri.sync.enabled=${KOERI_SYNC_ENABLED:true}
koeri.sync.interval-ms=${KOERI_SYNC_INTERVAL_MS:600000}
koeri.sync.initial-delay-ms=${KOERI_INITIAL_DELAY_MS:15000}
koeri.http.connect-timeout-ms=${KOERI_CONNECT_TIMEOUT_MS:10000}
koeri.http.read-timeout-ms=${KOERI_READ_TIMEOUT_MS:20000}

# Matching Configuration
app.matching.time-window-seconds=${APP_MATCHING_TIME_WINDOW_SECONDS:120}
app.matching.max-distance-km=${APP_MATCHING_MAX_DISTANCE_KM:50.0}
app.matching.auto-match-threshold=${APP_MATCHING_AUTO_MATCH_THRESHOLD:0.70}
app.matching.score-margin=${APP_MATCHING_SCORE_MARGIN:0.10}
