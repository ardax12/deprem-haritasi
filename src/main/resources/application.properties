spring.application.name=deprem

# Server port (uses Heroku $PORT when deployed)
server.port=${PORT:8080}

# Database Configuration:
# Defaults to in-memory H2 with PostgreSQL compatibility for zero-setup local development.
# In production / cloud, set SPRING_DATASOURCE_URL or DATABASE_URL to connect to Supabase / PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:depremdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}}
# Driver class is auto-detected by Spring Boot from the JDBC URL (org.postgresql.Driver for postgresql, org.h2.Driver for h2)
# spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

# H2 Console (available at http://localhost:8080/h2-console during local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# AFAD Poller Configuration
afad.api.url=${AFAD_API_URL:https://deprem.afad.gov.tr/apiv2/event/filter}
afad.sync.enabled=${AFAD_SYNC_ENABLED:true}
afad.sync.interval-ms=${AFAD_SYNC_INTERVAL_MS:600000}
afad.sync.window-hours=${AFAD_SYNC_WINDOW_HOURS:24}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
